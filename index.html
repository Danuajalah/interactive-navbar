<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <nav class="navbar">
            <ul>
                <li class="list active">
                    <a href="#">
                        <span class="logo"><ion-icon name="person-outline"></ion-icon></span>
                    </a>
                </li>
                <li class="list">
                    <a href="#">
                        <span class="logo"><ion-icon name="storefront-outline"></ion-icon></span>
                    </a>
                </li>
                <li class="list">
                    <a href="#">
                        <span class="logo"><ion-icon name="home-outline"></ion-icon></ion-icon></span>
                    </a>
                </li>
                <li class="list">
                    <a href="#">
                        <span class="logo"><ion-icon name="bookmark-outline"></ion-icon></span>
                    </a>
                </li>
                <li class="list">
                    <a href="#">
                        <span class="logo"><ion-icon name="cog-outline"></ion-icon></span>
                    </a>
                </li>

                <span class="indikator"></span>
            </ul>
        </nav>
    </main>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script>
        const list = document.querySelectorAll('.list');

        function navbar(){
            list.forEach((item) => 
                item.classList.remove('active'));
            this.classList.add('active');
        }

        list.forEach((item) => item.addEventListener('click', navbar))
        
    </script>
</body>
</html>
